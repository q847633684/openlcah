<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>截图覆盖随机器</title>
    <style>
      :root {
        --bg: #0f1117;
        --panel: #1a1f2c;
        --panel-soft: #242a3a;
        --text: #f5f7ff;
        --muted: #9aa3bd;
        --accent: #4e7bff;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }

      .app {
        max-width: 1200px;
        margin: 0 auto;
        display: grid;
        gap: 14px;
        grid-template-columns: 320px 1fr;
      }

      .panel {
        background: var(--panel);
        border-radius: 14px;
        padding: 14px;
        display: grid;
        gap: 12px;
        align-content: start;
      }

      .panel h1 {
        font-size: 18px;
      }

      .panel p {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .block {
        background: var(--panel-soft);
        border-radius: 10px;
        padding: 10px;
        display: grid;
        gap: 8px;
      }

      .block label {
        font-size: 13px;
      }

      input[type="file"],
      input[type="number"] {
        width: 100%;
        border: 1px solid #38415d;
        border-radius: 8px;
        padding: 8px 10px;
        color: #e9ecff;
        background: #141a28;
      }

      .rect-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .rect-grid .item {
        display: grid;
        gap: 5px;
      }

      .rect-grid .item span {
        font-size: 11px;
        color: #a9b2cf;
      }

      .tiny-actions {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }

      .tiny-actions button {
        flex: 1 1 48%;
        font-size: 12px;
        padding: 8px;
      }

      .check {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: #b8c0da;
      }

      .actions {
        display: grid;
        gap: 8px;
      }

      button {
        border: 0;
        border-radius: 9px;
        padding: 10px;
        font-size: 14px;
        cursor: pointer;
      }

      .btn-primary {
        background: linear-gradient(180deg, #4d7dff, #3559e6);
        color: #fff;
      }

      .btn-sub {
        background: #eef2ff;
        color: #2f3f76;
      }

      .status {
        font-size: 12px;
        color: #cfd6f0;
      }

      .workspace {
        background: var(--panel);
        border-radius: 14px;
        padding: 14px;
        display: grid;
        gap: 10px;
      }

      .preview-wrap {
        overflow: auto;
        border-radius: 10px;
        background: #0b0d13;
        border: 1px solid #2f364b;
        max-height: 82vh;
        display: grid;
        place-items: start center;
        padding: 10px;
      }

      canvas {
        background: #fff;
        max-width: 100%;
        height: auto;
      }

      .thumbs {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 8px;
      }

      .thumbs img {
        width: 100%;
        border-radius: 8px;
        border: 1px solid #36405c;
      }

      @media (max-width: 900px) {
        .app {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="panel">
        <h1>截图覆盖随机器</h1>
        <p>
          当前为<strong>固定原图尺寸模式（473x1024）</strong>：仅覆盖名字、时间、资料文案和消息文案。
          头像按你要求：<strong>50% 保留原图头像，50% 自动随机生成</strong>。
        </p>

        <div class="block">
          <label for="baseUpload">1) 上传底图（你发给我的这张截图）</label>
          <input id="baseUpload" type="file" accept="image/*" />
        </div>

        <div class="block">
          <label for="batchCount">2) 批量导出数量</label>
          <input id="batchCount" type="number" min="1" max="50" value="10" />
        </div>

        <div class="block">
          <label>3) 覆盖区域微调（像素）</label>
          <div class="rect-grid">
            <label class="item">
              <span>X</span>
              <input id="frameX" type="number" value="0" />
            </label>
            <label class="item">
              <span>Y</span>
              <input id="frameY" type="number" value="0" />
            </label>
            <label class="item">
              <span>宽 W</span>
              <input id="frameW" type="number" value="473" />
            </label>
            <label class="item">
              <span>高 H</span>
              <input id="frameH" type="number" value="1024" />
            </label>
          </div>
          <div class="tiny-actions">
            <button class="btn-sub" id="autoRectBtn" type="button">重新自动识别</button>
            <button class="btn-sub" id="applyRectBtn" type="button">应用校准</button>
            <button class="btn-sub" id="pickRectBtn" type="button">两点标定</button>
          </div>
          <label class="check">
            <input id="showFrameGuide" type="checkbox" />
            显示覆盖区域边框（用于对齐）
          </label>
        </div>

        <div class="actions">
          <button class="btn-primary" id="previewBtn">随机预览 1 张</button>
          <button class="btn-sub" id="exportBtn">批量导出随机图</button>
        </div>

        <p class="status" id="statusText">等待上传底图…</p>
      </aside>

      <main class="workspace">
        <div class="preview-wrap">
          <canvas id="previewCanvas" width="473" height="1024"></canvas>
        </div>
        <div class="thumbs" id="thumbs"></div>
      </main>
    </div>

    <script>
      const REF_WIDTH = 473;
      const REF_HEIGHT = 1024;
      const STRICT_MODE = true;
      const SCREEN_BG = "#edf0f7";
      const NAV_BG = "#ffffff";
      const BUBBLE_BG = "#ffcf2f";

      const names = ["天下无敌", "深夜小宇", "君傻瓜", "奶崽", "盛夏，，", "谈情不如逗狗。", "阿北", "晚安橘子"];
      const cities = ["上海", "北京", "广东 广州", "四川 凉山", "云南 昆明", "文莱", "杭州", "苏州"];
      const genders = ["♂", "♀"];
      const messages = [
        "和小美聊完了也和小丑聊两句呗",
        "和小美聊完了也和小丑聊会儿呗",
        "和小美聊完了也和小丑聊几句呗",
        "和小美聊完了也和小丑再聊呗",
      ];
      const onlineStates = ["在线", "离线"];

      const previewCanvas = document.getElementById("previewCanvas");
      const previewCtx = previewCanvas.getContext("2d");
      const uploadInput = document.getElementById("baseUpload");
      const batchCountInput = document.getElementById("batchCount");
      const frameXInput = document.getElementById("frameX");
      const frameYInput = document.getElementById("frameY");
      const frameWInput = document.getElementById("frameW");
      const frameHInput = document.getElementById("frameH");
      const autoRectBtn = document.getElementById("autoRectBtn");
      const applyRectBtn = document.getElementById("applyRectBtn");
      const pickRectBtn = document.getElementById("pickRectBtn");
      const showFrameGuideInput = document.getElementById("showFrameGuide");
      const thumbs = document.getElementById("thumbs");
      const statusText = document.getElementById("statusText");

      let baseImage = null;
      let frameRect = null;
      let currentProfile = randomProfile();
      let pickingRect = false;
      let pickStart = null;

      function pick(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      }

      function randInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function pad(v) {
        return String(v).padStart(2, "0");
      }

      function randomTime() {
        return `${pad(randInt(15, 23))}:${pad(randInt(0, 59))}`;
      }

      function randomProfile() {
        const hasAge = Math.random() < 0.8;
        const age = hasAge ? randInt(20, 35) : "";
        const city = pick(cities);
        const gender = pick(genders);
        const birthday = Math.random() < 0.75 ? `${pad(randInt(1, 12))}-${pad(randInt(1, 28))}` : "";
        return {
          name: pick(names),
          gender,
          age,
          city,
          birthday,
          status: pick(onlineStates),
          message: pick(messages),
          keepOriginalAvatar: Math.random() < 0.5,
        };
      }

      function setStatus(message) {
        statusText.textContent = message;
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function normalizeRect(rect, width, height) {
        const minSize = 80;
        const x = clamp(Math.round(rect.x || 0), 0, Math.max(0, width - minSize));
        const y = clamp(Math.round(rect.y || 0), 0, Math.max(0, height - minSize));
        const w = clamp(Math.round(rect.w || width), minSize, width - x);
        const h = clamp(Math.round(rect.h || height), minSize, height - y);
        return { x, y, w, h };
      }

      function syncRectInputs(rect) {
        frameXInput.value = Math.round(rect.x);
        frameYInput.value = Math.round(rect.y);
        frameWInput.value = Math.round(rect.w);
        frameHInput.value = Math.round(rect.h);
      }

      function readRectInputs() {
        const fallback = frameRect || { x: 0, y: 0, w: REF_WIDTH, h: REF_HEIGHT };
        return {
          x: Number(frameXInput.value || fallback.x),
          y: Number(frameYInput.value || fallback.y),
          w: Number(frameWInput.value || fallback.w),
          h: Number(frameHInput.value || fallback.h),
        };
      }

      function getActiveRect() {
        if (!baseImage) {
          return { x: 0, y: 0, w: REF_WIDTH, h: REF_HEIGHT };
        }
        return normalizeRect(readRectInputs(), baseImage.width, baseImage.height);
      }

      function canvasPointFromEvent(event, canvas) {
        const bounds = canvas.getBoundingClientRect();
        const scaleX = canvas.width / bounds.width;
        const scaleY = canvas.height / bounds.height;
        return {
          x: (event.clientX - bounds.left) * scaleX,
          y: (event.clientY - bounds.top) * scaleY,
        };
      }

      function roundRect(ctx, x, y, width, height, radius) {
        const r = Math.min(radius, width / 2, height / 2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + width, y, x + width, y + height, r);
        ctx.arcTo(x + width, y + height, x, y + height, r);
        ctx.arcTo(x, y + height, x, y, r);
        ctx.arcTo(x, y, x + width, y, r);
        ctx.closePath();
      }

      function wrapText(ctx, text, maxWidth) {
        const lines = [];
        let current = "";
        for (const ch of text) {
          const trial = current + ch;
          if (ctx.measureText(trial).width <= maxWidth) {
            current = trial;
          } else {
            lines.push(current);
            current = ch;
          }
        }
        if (current) {
          lines.push(current);
        }
        return lines;
      }

      function truncateToWidth(ctx, text, maxWidth) {
        if (ctx.measureText(text).width <= maxWidth) {
          return text;
        }
        let current = text;
        while (current.length > 0 && ctx.measureText(`${current}…`).width > maxWidth) {
          current = current.slice(0, -1);
        }
        return `${current}…`;
      }

      function drawRandomAvatar(ctx, cx, cy, r) {
        const bgColors = ["#ff79a7", "#ff9f5e", "#5f97ff", "#64c794", "#9f7dff"];
        const faceColors = ["#ffe4ca", "#f8d8b6", "#f2c89d", "#f9dcc4"];
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.clip();

        ctx.fillStyle = pick(bgColors);
        ctx.fillRect(cx - r, cy - r, r * 2, r * 2);

        ctx.fillStyle = pick(faceColors);
        ctx.beginPath();
        ctx.arc(cx, cy + r * 0.05, r * 0.58, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#1f2430";
        ctx.beginPath();
        ctx.arc(cx - r * 0.22, cy - r * 0.07, r * 0.07, 0, Math.PI * 2);
        ctx.arc(cx + r * 0.22, cy - r * 0.07, r * 0.07, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "#1f2430";
        ctx.lineWidth = Math.max(1, r * 0.05);
        ctx.beginPath();
        ctx.arc(cx, cy + r * 0.12, r * 0.22, 0.2, Math.PI - 0.2);
        ctx.stroke();
        ctx.restore();
      }

      function detectPhoneFrame(image) {
        const tempCanvas = document.createElement("canvas");
        tempCanvas.width = image.width;
        tempCanvas.height = image.height;
        const tempCtx = tempCanvas.getContext("2d");
        tempCtx.drawImage(image, 0, 0);

        const { data, width, height } = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
        let minX = width;
        let minY = height;
        let maxX = -1;
        let maxY = -1;

        for (let y = 0; y < height; y += 1) {
          for (let x = 0; x < width; x += 1) {
            const idx = (y * width + x) * 4;
            const r = data[idx];
            const g = data[idx + 1];
            const b = data[idx + 2];
            const a = data[idx + 3];
            if (a < 10) {
              continue;
            }
            const luminance = 0.2126 * r + 0.7152 * g + 0.0722 * b;
            // Focus on bright UI pixels (white + light gray screen), ignore dark backgrounds and blue debug borders.
            if (luminance > 220) {
              if (x < minX) minX = x;
              if (y < minY) minY = y;
              if (x > maxX) maxX = x;
              if (y > maxY) maxY = y;
            }
          }
        }

        if (maxX <= minX || maxY <= minY) {
          return { x: 0, y: 0, w: width, h: height };
        }

        return {
          x: Math.max(0, minX - 4),
          y: Math.max(0, minY - 4),
          w: Math.min(width - minX + 4, maxX - minX + 8),
          h: Math.min(height - minY + 4, maxY - minY + 8),
        };
      }

      function hasDebugBorder(image) {
        const c = document.createElement("canvas");
        c.width = image.width;
        c.height = image.height;
        const t = c.getContext("2d");
        t.drawImage(image, 0, 0);
        const { data, width, height } = t.getImageData(0, 0, c.width, c.height);
        let sampled = 0;
        let blueLike = 0;
        const check = (x, y) => {
          const idx = (y * width + x) * 4;
          const r = data[idx];
          const g = data[idx + 1];
          const b = data[idx + 2];
          sampled += 1;
          if (b > 150 && b - r > 40 && b - g > 20) {
            blueLike += 1;
          }
        };
        for (let x = 0; x < width; x += Math.max(1, Math.round(width / 120))) {
          check(x, 0);
          check(x, height - 1);
        }
        for (let y = 0; y < height; y += Math.max(1, Math.round(height / 160))) {
          check(0, y);
          check(width - 1, y);
        }
        return sampled > 0 && blueLike / sampled > 0.12;
      }

      function drawVariant(canvas, profile, options = {}) {
        if (!baseImage) {
          return;
        }
        const { showGuide = false } = options;
        if (STRICT_MODE && (baseImage.width !== REF_WIDTH || baseImage.height !== REF_HEIGHT)) {
          setStatus(`当前是固定尺寸模式，请上传 ${REF_WIDTH}x${REF_HEIGHT} 的原图。`);
          return;
        }
        const ctx = canvas.getContext("2d");
        canvas.width = baseImage.width;
        canvas.height = baseImage.height;
        const rect = STRICT_MODE ? { x: 0, y: 0, w: REF_WIDTH, h: REF_HEIGHT } : getActiveRect();
        const sx = STRICT_MODE ? 1 : rect.w / REF_WIDTH;
        const sy = STRICT_MODE ? 1 : rect.h / REF_HEIGHT;
        const S = (n) => n * (STRICT_MODE ? 1 : Math.min(sx, sy));
        const X = (n) => rect.x + n * sx;
        const Y = (n) => rect.y + n * sy;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(baseImage, 0, 0, canvas.width, canvas.height);

        const now = randomTime();
        const title = profile.name;
        const stateColor = profile.status === "在线" ? "#32d365" : "#c4c9d2";
        const meta = profile.age ? `${profile.gender}${profile.age}岁   ${profile.city}` : `${profile.gender}   ${profile.city}`;
        const birthdayText = profile.birthday ? `Ta [${profile.birthday}] 过生日~` : "快来和我聊聊天吧～";

        // 1) Strict replacement regions.
        ctx.fillStyle = NAV_BG;
        ctx.fillRect(X(20), Y(18), X(106) - X(20), Y(56) - Y(18)); // status time
        ctx.fillRect(X(70), Y(82), X(276) - X(70), Y(165) - Y(82)); // title + online line
        ctx.fillRect(X(96), Y(206), X(360) - X(96), Y(286) - Y(206)); // card text two lines

        ctx.fillStyle = SCREEN_BG;
        ctx.fillRect(X(188), Y(348), X(288) - X(188), Y(382) - Y(348)); // middle time

        // Always redraw one stable bubble to prevent stacked artifacts from dirty input screenshots.
        ctx.fillStyle = SCREEN_BG;
        ctx.fillRect(X(124), Y(414), X(404) - X(124), Y(511) - Y(414));
        ctx.fillStyle = BUBBLE_BG;
        roundRect(ctx, X(132), Y(431), X(397) - X(132), Y(488) - Y(431), S(14));
        ctx.fill();

        // 2) Draw dynamic text.
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#0f131b";
        ctx.font = `600 ${Math.round(22 * S(1))}px "PingFang SC", sans-serif`;
        ctx.fillText(now, X(28), Y(41));

        ctx.fillStyle = "#1b2234";
        ctx.font = `600 ${Math.round(24 * S(1))}px "PingFang SC", sans-serif`;
        const topTitle = truncateToWidth(ctx, title, X(268) - X(80));
        ctx.fillText(topTitle, X(80), Y(108));

        ctx.beginPath();
        ctx.fillStyle = stateColor;
        ctx.arc(X(84), Y(151), Math.max(2.5, S(4.5)), 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#a5aab7";
        ctx.font = `${Math.round(14 * S(1))}px "PingFang SC", sans-serif`;
        ctx.fillText(profile.status, X(98), Y(151));

        ctx.fillStyle = "#2a2f3e";
        ctx.font = `600 ${Math.round(18 * S(1))}px "PingFang SC", sans-serif`;
        const cardTitle = truncateToWidth(ctx, title, X(178) - X(99));
        ctx.fillText(cardTitle, X(99), Y(228));
        ctx.fillStyle = "#5f6678";
        ctx.font = `${Math.round(15 * S(1))}px "PingFang SC", sans-serif`;
        const metaText = truncateToWidth(ctx, meta, X(352) - X(178));
        ctx.fillText(metaText, X(178), Y(228));

        ctx.fillStyle = "#7f8798";
        ctx.font = `${Math.round(13.5 * S(1))}px "PingFang SC", sans-serif`;
        ctx.fillText(`○ ${birthdayText}`, X(99), Y(273));

        ctx.fillStyle = "#acb3c2";
        ctx.font = `${Math.round(17 * S(1))}px "PingFang SC", sans-serif`;
        ctx.textAlign = "center";
        ctx.fillText(now, X(236), Y(366));
        ctx.textAlign = "start";

        ctx.fillStyle = "#22252e";
        ctx.font = `500 ${Math.round(17 * S(1))}px "PingFang SC", sans-serif`;
        ctx.textBaseline = "middle";
        const maxWidth = X(372) - X(176);
        const msg = truncateToWidth(ctx, profile.message, maxWidth);
        ctx.fillText(msg, X(146), Y(460));

        if (!profile.keepOriginalAvatar) {
          drawRandomAvatar(ctx, X(64), Y(235), S(29));
        }

        if (showGuide) {
          ctx.save();
          ctx.strokeStyle = "rgba(75, 130, 255, 0.9)";
          ctx.lineWidth = Math.max(1, S(2));
          ctx.setLineDash([Math.max(4, S(8)), Math.max(3, S(5))]);
          ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
          ctx.fillStyle = "rgba(75, 130, 255, 0.95)";
          ctx.fillRect(rect.x - 3, rect.y - 3, 6, 6);
          ctx.fillRect(rect.x + rect.w - 3, rect.y - 3, 6, 6);
          ctx.fillRect(rect.x - 3, rect.y + rect.h - 3, 6, 6);
          ctx.fillRect(rect.x + rect.w - 3, rect.y + rect.h - 3, 6, 6);
          ctx.restore();
        }

        if (pickingRect && pickStart) {
          ctx.save();
          ctx.strokeStyle = "rgba(255, 197, 56, 0.95)";
          ctx.lineWidth = Math.max(1, S(2));
          ctx.setLineDash([Math.max(4, S(8)), Math.max(3, S(5))]);
          ctx.strokeRect(pickStart.x - 4, pickStart.y - 4, 8, 8);
          ctx.restore();
        }
      }

      function redrawPreview() {
        if (!baseImage) {
          return;
        }
        drawVariant(previewCanvas, currentProfile, { showGuide: showFrameGuideInput.checked });
      }

      function toBlob(canvas) {
        return new Promise((resolve) => {
          canvas.toBlob((blob) => resolve(blob), "image/png");
        });
      }

      async function previewOne() {
        if (!baseImage) {
          setStatus("请先上传底图。");
          return;
        }
        currentProfile = randomProfile();
        redrawPreview();
        setStatus("已生成 1 张预览。");
      }

      async function exportBatch() {
        if (!baseImage) {
          setStatus("请先上传底图。");
          return;
        }
        const count = Math.max(1, Math.min(50, Number(batchCountInput.value) || 1));
        thumbs.innerHTML = "";
        setStatus(`正在导出 ${count} 张...`);

        for (let i = 0; i < count; i += 1) {
          const canvas = document.createElement("canvas");
          drawVariant(canvas, randomProfile(), { showGuide: false });
          const blob = await toBlob(canvas);
          if (!blob) {
            continue;
          }
          const url = URL.createObjectURL(blob);
          const thumb = document.createElement("img");
          thumb.src = url;
          thumb.alt = `导出预览 ${i + 1}`;
          thumbs.appendChild(thumb);

          const link = document.createElement("a");
          link.href = url;
          link.download = `chat-random-${String(i + 1).padStart(2, "0")}.png`;
          document.body.appendChild(link);
          link.click();
          link.remove();
        }
        setStatus(`导出完成：${count} 张（头像 50% 保留原图，50% 随机）。`);
      }

      uploadInput.addEventListener("change", async (event) => {
        const file = event.target.files?.[0];
        if (!file) {
          return;
        }
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          if (STRICT_MODE && (img.width !== REF_WIDTH || img.height !== REF_HEIGHT)) {
            baseImage = null;
            setStatus(`尺寸不匹配：当前 ${img.width}x${img.height}，固定模式需要 ${REF_WIDTH}x${REF_HEIGHT} 原图。`);
            URL.revokeObjectURL(url);
            return;
          }
          if (STRICT_MODE && hasDebugBorder(img)) {
            baseImage = null;
            setStatus("检测到边缘蓝色虚线/预览边框，请上传最原始聊天截图。");
            URL.revokeObjectURL(url);
            return;
          }
          baseImage = img;
          frameRect = detectPhoneFrame(img);
          syncRectInputs(frameRect);
          currentProfile = randomProfile();
          redrawPreview();
          setStatus(`底图已加载：${img.width} x ${img.height}`);
          URL.revokeObjectURL(url);
        };
        img.onerror = () => {
          setStatus("底图加载失败，请换一张 PNG/JPG。");
          URL.revokeObjectURL(url);
        };
        img.src = url;
      });

      document.getElementById("previewBtn").addEventListener("click", previewOne);
      document.getElementById("exportBtn").addEventListener("click", exportBatch);
      autoRectBtn.addEventListener("click", () => {
        if (!baseImage) {
          setStatus("请先上传底图。");
          return;
        }
        frameRect = detectPhoneFrame(baseImage);
        syncRectInputs(frameRect);
        redrawPreview();
        setStatus("已重新自动识别覆盖区域。");
      });
      applyRectBtn.addEventListener("click", () => {
        if (!baseImage) {
          setStatus("请先上传底图。");
          return;
        }
        frameRect = getActiveRect();
        syncRectInputs(frameRect);
        redrawPreview();
        setStatus(`已应用校准：x=${frameRect.x}, y=${frameRect.y}, w=${frameRect.w}, h=${frameRect.h}`);
      });
      [frameXInput, frameYInput, frameWInput, frameHInput].forEach((input) => {
        input.addEventListener("input", () => {
          if (!baseImage) {
            return;
          }
          redrawPreview();
        });
      });
      showFrameGuideInput.addEventListener("change", redrawPreview);
      pickRectBtn.addEventListener("click", () => {
        if (!baseImage) {
          setStatus("请先上传底图。");
          return;
        }
        pickingRect = true;
        pickStart = null;
        setStatus("两点标定已开启：先点手机内容左上角，再点右下角。");
      });
      previewCanvas.addEventListener("click", (event) => {
        if (!baseImage || !pickingRect) {
          return;
        }
        const point = canvasPointFromEvent(event, previewCanvas);
        if (!pickStart) {
          pickStart = point;
          redrawPreview();
          setStatus("已记录第 1 点（左上角），请再点第 2 点（右下角）。");
          return;
        }

        const rectRaw = {
          x: Math.min(pickStart.x, point.x),
          y: Math.min(pickStart.y, point.y),
          w: Math.abs(point.x - pickStart.x),
          h: Math.abs(point.y - pickStart.y),
        };
        frameRect = normalizeRect(rectRaw, baseImage.width, baseImage.height);
        syncRectInputs(frameRect);
        pickingRect = false;
        pickStart = null;
        redrawPreview();
        setStatus(`两点标定完成：x=${frameRect.x}, y=${frameRect.y}, w=${frameRect.w}, h=${frameRect.h}`);
      });

      previewCtx.fillStyle = "#11151f";
      previewCtx.fillRect(0, 0, previewCanvas.width, previewCanvas.height);
      previewCtx.fillStyle = "#8d97b7";
      previewCtx.font = "18px sans-serif";
      previewCtx.fillText("请先在左侧上传你的截图底图", 40, 80);
    </script>
  </body>
</html>
