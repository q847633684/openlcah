<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>聊天模板（高仿版）</title>
    <style>
      :root {
        --page-bg: #171717;
        --screen-bg: #edf0f7;
        --nav-bg: #ffffff;
        --text-main: #202430;
        --text-subtle: #9fa6b7;
        --bubble: #ffce2e;
        --card-radius: 15px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--page-bg);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }

      .phone {
        width: min(390px, 96vw);
        height: min(844px, 97vh);
        background: var(--screen-bg);
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 26px 50px rgba(0, 0, 0, 0.45);
        display: flex;
        flex-direction: column;
      }

      .status {
        background: var(--nav-bg);
        height: 44px;
        padding: 11px 14px 0;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
      }

      .status-time {
        color: #10131a;
        font-size: 19px;
        font-weight: 700;
        letter-spacing: 0.2px;
      }

      .status-icons {
        display: flex;
        align-items: center;
        gap: 7px;
      }

      .signal {
        width: 16px;
        height: 12px;
        display: grid;
        grid-template-columns: repeat(4, 3px);
        gap: 1px;
        align-items: end;
      }

      .signal i {
        display: block;
        background: #61a8ff;
        border-radius: 1px;
      }

      .signal i:nth-child(1) {
        height: 4px;
      }

      .signal i:nth-child(2) {
        height: 7px;
      }

      .signal i:nth-child(3) {
        height: 9px;
      }

      .signal i:nth-child(4) {
        height: 11px;
      }

      .wifi {
        width: 13px;
        height: 10px;
        border: 2px solid transparent;
        border-top-color: #111;
        border-radius: 50%;
        position: relative;
      }

      .wifi::after {
        content: "";
        position: absolute;
        left: 2px;
        top: -1px;
        width: 5px;
        height: 5px;
        border: 2px solid transparent;
        border-top-color: #111;
        border-radius: 50%;
      }

      .battery {
        width: 18px;
        height: 11px;
        border: 1.6px solid #9dc890;
        border-radius: 3px;
        padding: 1px;
        position: relative;
      }

      .battery::after {
        content: "";
        position: absolute;
        right: -3px;
        top: 3px;
        width: 2px;
        height: 4px;
        background: #9dc890;
        border-radius: 1px;
      }

      .battery i {
        display: block;
        width: 100%;
        height: 100%;
        background: #9ed57e;
        border-radius: 1px;
      }

      .nav {
        height: 64px;
        background: var(--nav-bg);
        padding: 0 16px;
        display: flex;
        align-items: center;
      }

      .nav-back {
        width: 22px;
        color: #161a24;
        font-size: 23px;
        line-height: 1;
      }

      .nav-main {
        margin-left: 8px;
        flex: 1;
        min-width: 0;
      }

      .title {
        font-size: 21px;
        line-height: 1;
        font-weight: 700;
        color: #101625;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .online-row {
        margin-top: 6px;
        color: #aab0c0;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .online-dot {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: #32d365;
      }

      .nav-right {
        width: 34px;
        text-align: right;
        font-size: 24px;
        line-height: 1;
        color: #1f2331;
      }

      .profile-card {
        margin: 12px 16px 0;
        border-radius: var(--card-radius);
        background: #fff;
        padding: 12px;
        display: flex;
        gap: 11px;
        align-items: center;
      }

      .target-avatar {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        object-fit: cover;
      }

      .profile-text {
        flex: 1;
        min-width: 0;
      }

      .profile-head {
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
      }

      .name {
        color: var(--text-main);
        font-size: 20px;
        font-weight: 700;
        white-space: nowrap;
        max-width: 130px;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .meta {
        color: #52586b;
        font-size: 14px;
        white-space: nowrap;
      }

      .profile-sub {
        margin-top: 8px;
        color: #7f8698;
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .birthday-dot {
        color: #98a0b6;
      }

      .home-chip {
        border-radius: 999px;
        background: #fff5f7;
        color: #353b4f;
        font-size: 14px;
        padding: 6px 10px;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        align-self: flex-start;
      }

      .home-chip i {
        width: 15px;
        height: 15px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #ff97af, #ff5f88);
      }

      .chat-time {
        margin-top: 30px;
        text-align: center;
        color: #a9afbe;
        font-size: 17px;
      }

      .chat-body {
        flex: 1;
        padding: 22px 14px 0;
      }

      .message-row {
        display: flex;
        justify-content: flex-end;
        align-items: flex-start;
        gap: 8px;
      }

      .bubble {
        max-width: 326px;
        background: var(--bubble);
        border-radius: 14px;
        color: #1f242e;
        font-size: 18px;
        line-height: 1.34;
        padding: 14px 15px;
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.05);
      }

      .my-avatar {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        object-fit: cover;
      }

      .composer {
        background: #fff;
        padding: 12px 14px 10px;
      }

      .input-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .fake-input {
        flex: 1;
        height: 40px;
        border-radius: 20px;
        background: #f4f6fb;
        padding: 0 16px;
        color: #c5cad5;
        font-size: 16px;
        display: flex;
        align-items: center;
      }

      .emoji {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: #ffd64f;
        font-size: 24px;
        display: grid;
        place-items: center;
      }

      .tool-row {
        margin-top: 10px;
        display: flex;
        align-items: center;
        gap: 18px;
        color: #9096a8;
        font-size: 22px;
      }

      .action-row {
        margin-top: 10px;
        display: flex;
        gap: 8px;
      }

      .btn {
        border: 0;
        border-radius: 9px;
        padding: 8px 12px;
        font-size: 13px;
        line-height: 1;
        cursor: pointer;
      }

      .btn-primary {
        color: #fff;
        background: linear-gradient(180deg, #3d7bff, #2b57f1);
        box-shadow: 0 3px 8px rgba(56, 88, 241, 0.25);
      }

      .btn-muted {
        color: #2e3a64;
        background: #f1f3ff;
      }
    </style>
  </head>
  <body>
    <main class="phone">
      <div class="status">
        <span class="status-time" id="topTime">17:32</span>
        <div class="status-icons">
          <span class="signal"><i></i><i></i><i></i><i></i></span>
          <span class="wifi"></span>
          <span class="battery"><i></i></span>
        </div>
      </div>

      <header class="nav">
        <span class="nav-back">‹</span>
        <div class="nav-main">
          <h1 class="title" id="titleName">深夜小宇</h1>
          <p class="online-row"><i class="online-dot" id="statusDot"></i><span id="statusText">在线</span></p>
        </div>
        <span class="nav-right">♡+</span>
      </header>

      <section class="profile-card">
        <img class="target-avatar" id="targetAvatar" alt="对方头像" />
        <div class="profile-text">
          <div class="profile-head">
            <strong class="name" id="cardName">深夜小宇</strong>
            <span class="meta" id="cardMeta">♀21岁 北京</span>
          </div>
          <p class="profile-sub"><span class="birthday-dot">○</span><span id="signature">Ta [10-22] 过生日~</span></p>
        </div>
        <span class="home-chip"><i></i>看主页</span>
      </section>

      <p class="chat-time" id="midTime">17:32</p>

      <section class="chat-body">
        <div class="message-row">
          <div class="bubble" id="bubbleText">和小美聊完了也和小丑聊两句呗</div>
          <img
            class="my-avatar"
            src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=88&q=80"
            alt="我的头像"
          />
        </div>
      </section>

      <footer class="composer">
        <div class="input-row">
          <div class="fake-input">说点什么吧</div>
          <span class="emoji">😄</span>
        </div>
        <div class="tool-row">
          <span>🖼️</span>
          <span>📷</span>
          <span>🎁</span>
        </div>
        <div class="action-row">
          <button class="btn btn-primary" id="randomProfileBtn">随机换对方资料</button>
          <button class="btn btn-muted" id="randomAllBtn">资料+话术一起随机</button>
        </div>
      </footer>
    </main>

    <script>
      const profiles = [
        { name: "深夜小宇", gender: "♀", age: 21, city: "北京", birthday: "10-22", status: "在线" },
        { name: "天下无敌", gender: "♂", age: 32, city: "上海", birthday: "01-01", status: "离线" },
        { name: "君傻瓜", gender: "♂", age: 27, city: "四川 凉山", birthday: "01-01", status: "离线" },
        { name: "奶崽", gender: "♂", age: "", city: "云南 昆明", birthday: "", status: "离线" },
        { name: "盛夏，，", gender: "♂", age: "", city: "广东 广州", birthday: "", status: "离线" },
        { name: "谈情不如逗狗。", gender: "♂", age: "", city: "文莱", birthday: "", status: "在线" },
      ];

      const targetAvatars = [
        "https://api.dicebear.com/9.x/thumbs/svg?seed=night",
        "https://api.dicebear.com/9.x/thumbs/svg?seed=enemy",
        "https://api.dicebear.com/9.x/thumbs/svg?seed=summer",
        "https://api.dicebear.com/9.x/thumbs/svg?seed=bear",
        "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=88&q=80",
        "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=88&q=80",
      ];

      const chats = [
        "和小美聊完了也和小丑聊两句呗",
        "和小美聊完了以后小丑聊两句呗",
        "和小美聊完了，也和小丑聊两句呗",
        "你看起来很有趣，要不要聊聊",
      ];

      const statusStyle = {
        在线: { color: "#32d365" },
        离线: { color: "#c4c9d2" },
        忙碌: { color: "#ff6e7b" },
      };

      const pick = (list) => list[Math.floor(Math.random() * list.length)];
      const pad = (num) => String(num).padStart(2, "0");

      function nowHm() {
        const d = new Date();
        return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
      }

      function renderTime() {
        const t = nowHm();
        document.getElementById("topTime").textContent = t;
        document.getElementById("midTime").textContent = t;
      }

      function renderProfile(profile) {
        const avatar = pick(targetAvatars);
        const status = statusStyle[profile.status] || statusStyle["离线"];
        const agePart = profile.age ? `${profile.gender}${profile.age}岁` : profile.gender;

        document.getElementById("titleName").textContent = profile.name;
        document.getElementById("cardName").textContent = profile.name;
        document.getElementById("statusText").textContent = profile.status;
        document.getElementById("statusDot").style.background = status.color;
        document.getElementById("targetAvatar").src = avatar;

        document.getElementById("cardMeta").textContent = `${agePart}  ${profile.city}`;
        document.getElementById("signature").textContent = profile.birthday
          ? `Ta [${profile.birthday}] 过生日~`
          : "快来和我聊聊天吧～";
      }

      function renderMessage() {
        document.getElementById("bubbleText").textContent = pick(chats);
      }

      document.getElementById("randomProfileBtn").addEventListener("click", () => {
        renderProfile(pick(profiles));
        renderTime();
      });

      document.getElementById("randomAllBtn").addEventListener("click", () => {
        renderProfile(pick(profiles));
        renderMessage();
        renderTime();
      });

      renderProfile(pick(profiles));
      renderMessage();
      renderTime();
      setInterval(renderTime, 20000);
    </script>
  </body>
</html>
